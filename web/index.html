<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>湘村小灶 · XiangCun XiaoZao</title>
<meta name="description" content="湘村小灶——吉隆坡湖南家常菜。在线菜单即将上线。">
<style>
  :root {
    --red: #b3261e;
    --red-deep: #7f1d17;
    --ink: #221a16;
    --paper: #f7f1e6;
    --gold: #d9a441;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #3a1512 0%, #1c0b09 65%, #120605 100%);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stage { text-align: center; padding: 24px; }
  .seal {
    width: 108px; height: 108px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--red) 0%, var(--red-deep) 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 40px rgba(179, 38, 30, .45), inset 0 2px 6px rgba(255,255,255,.18);
    animation: breathe 3.2s ease-in-out infinite;
  }
  .seal span {
    font-size: 44px;
    font-weight: 700;
    color: #ffe9c9;
    letter-spacing: 2px;
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 12px 40px rgba(179,38,30,.45), inset 0 2px 6px rgba(255,255,255,.18); }
    50% { transform: scale(1.045); box-shadow: 0 16px 56px rgba(217,164,65,.35), inset 0 2px 6px rgba(255,255,255,.22); }
  }
  h1 {
    font-size: 44px;
    letter-spacing: 10px;
    text-indent: 10px;
    color: #fdf3df;
    text-shadow: 0 3px 14px rgba(0,0,0,.5);
  }
  .sub {
    margin-top: 10px;
    font-size: 13px;
    letter-spacing: 6px;
    text-indent: 6px;
    color: #c9a06a;
    text-transform: uppercase;
  }
  .divider {
    width: 180px; height: 1px;
    margin: 30px auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .slogan { font-size: 16px; color: #e8d9bd; letter-spacing: 3px; }
  .soon {
    margin-top: 34px;
    display: inline-block;
    padding: 12px 34px;
    border: 1px solid rgba(217, 164, 65, .55);
    border-radius: 999px;
    font-size: 14px;
    letter-spacing: 4px;
    color: var(--gold);
    background: rgba(217, 164, 65, .08);
  }
  .soon .dot { animation: blink 1.4s infinite; }
  .soon .dot:nth-child(2) { animation-delay: .2s; }
  .soon .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .domain {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom));
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    color: rgba(232, 217, 189, .4);
  }
  @media (max-width: 380px) {
    h1 { font-size: 34px; letter-spacing: 7px; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="seal"><span>灶</span></div>
    <h1>湘村小灶</h1>
    <div class="sub">XiangCun XiaoZao · Hunan Kitchen</div>
    <div class="divider"></div>
    <div class="slogan">一口湖南火气 · 半城烟火滋味</div>
    <div class="soon">在线菜单即将上线<span class="dot">·</span><span class="dot">·</span><span class="dot">·</span></div>
  </div>
  <div class="domain">xiangcunxiaozao.com</div>
</body>
</html>
