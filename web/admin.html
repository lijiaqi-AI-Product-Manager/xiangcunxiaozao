<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>老板后台 · 湘村小灶</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root {
    --bg: #f6f1e8; --card: #fff; --edge: #e8dfd1;
    --red: #b3261e; --red-soft: #fdf0ee;
    --green: #2e7d4f; --green-soft: #eef7f1;
    --amber: #b07d2b; --amber-soft: #fbf3e3;
    --gray: #6d635a; --gray-soft: #f0ece5;
    --ink: #2a211b; --dim: #8d7d6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }

  .gate { position: fixed; inset: 0; z-index: 99; background: rgba(42,33,27,.97); display: flex; align-items: center; justify-content: center; }
  .gate.hide { display: none; }
  .gate-box { width: min(400px, 90vw); text-align: center; color: #fff; }
  .gate-box h1 { font-size: 24px; letter-spacing: 4px; margin-bottom: 4px; }
  .gate-box p { color: #cbbba8; font-size: 13px; margin-bottom: 24px; }
  .gate-box input { width: 100%; padding: 13px 16px; border-radius: 10px; border: 1px solid #6b5a48; background: rgba(255,255,255,.08); color: #fff; text-align: center; letter-spacing: 1px; outline: none; }
  .gate-box input:focus { border-color: #d9a441; }
  .gate-box button { width: 100%; margin-top: 14px; padding: 13px; border: none; border-radius: 10px; background: linear-gradient(145deg, #d9531e, #b3261e); color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 4px; }
  .gate-box .err { color: #ff8a70; font-size: 13px; margin-top: 10px; min-height: 18px; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 12px 14px 70px; }
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 12px; flex-wrap: wrap; gap: 8px; }
  header.top h1 { font-size: 19px; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #aaa; }
  .dot.on { background: #2e7d4f; box-shadow: 0 0 6px rgba(46,125,79,.8); }
  nav.tabs { display: flex; background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 4px; gap: 4px; }
  nav.tabs button { flex: 1; padding: 8px 10px; border: none; background: transparent; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--dim); white-space: nowrap; }
  nav.tabs button.on { background: var(--ink); color: #fff; }

  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 12px; }
  .stat .k { font-size: 12px; color: var(--dim); }
  .stat .v { font-size: 19px; font-weight: 800; margin-top: 2px; }
  .stat .v small { font-size: 11px; font-weight: 400; color: var(--dim); }
  .stat.warn .v { color: var(--red); }
  .stat.gold .v { color: var(--amber); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { padding: 6px 13px; border-radius: 999px; border: 1px solid var(--edge); background: var(--card); font-size: 13px; color: var(--dim); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip.red.on { background: var(--red); border-color: var(--red); }

  .card { background: var(--card); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .ohead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ohead .tbl { font-size: 20px; font-weight: 800; }
  .ohead .ono { font-size: 12px; color: var(--dim); }
  .ohead .time { font-size: 12px; color: var(--dim); margin-left: auto; }
  .tag { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; font-weight: 600; }
  .tag.pending { background: var(--red-soft); color: var(--red); }
  .tag.confirmed { background: var(--amber-soft); color: var(--amber); }
  .tag.served { background: var(--green-soft); color: var(--green); }
  .tag.cancelled, .tag.rejected, .tag.voided { background: var(--gray-soft); color: var(--gray); }
  .items { margin: 8px 0; font-size: 14px; line-height: 1.9; }
  .items .it.done { opacity: .5; text-decoration: line-through; }
  .note-line { font-size: 12.5px; color: var(--amber); background: var(--amber-soft); border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
  .pay-line { font-size: 12.5px; margin-top: 4px; color: var(--dim); }
  .pay-line b.paid { color: var(--green); }
  .pay-line b.unpaid { color: var(--red); }
  .oamount { font-size: 17px; font-weight: 800; color: var(--red); }
  .oact { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .oact button { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--edge); background: var(--card); font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .oact button.main { background: var(--green); border-color: var(--green); color: #fff; }
  .oact button.warn { background: var(--red); border-color: var(--red); color: #fff; }
  .oact button.gold { background: var(--amber); border-color: var(--amber); color: #fff; }

  .empty { text-align: center; color: var(--dim); padding: 30px 0; font-size: 14px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .toolbar input[type=date], .toolbar input[type=month] { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--edge); background: var(--card); }
  .btn { padding: 9px 16px; border-radius: 9px; border: none; background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 600; }
  .btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--edge); }
  .btn.green { background: var(--green); }
  .btn.red { background: var(--red); }
  .btn.sm { padding: 6px 10px; font-size: 12px; }

  table.tb { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.tb th { text-align: left; color: var(--dim); font-weight: 600; padding: 6px 8px; border-bottom: 1.5px solid var(--edge); font-size: 12.5px; }
  table.tb td { padding: 7px 8px; border-bottom: 1px solid var(--edge); }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12.5px; }
  .bar-row .bl { width: 76px; color: var(--dim); flex: none; }
  .bar-row .bar { height: 14px; border-radius: 4px; background: linear-gradient(90deg, #d9531e, #b3261e); min-width: 2px; }
  .bar-row .bv { color: var(--ink); font-weight: 600; }

  .mrow { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .mrow .cardno { font-weight: 800; font-size: 16px; letter-spacing: 1px; }
  .mrow .bal { color: var(--red); font-weight: 700; }
  .mrow .name { color: var(--dim); font-size: 13px; }
  .mrow .acts { margin-left: auto; display: flex; gap: 6px; }

  .modal { position: fixed; inset: 0; z-index: 90; background: rgba(42,33,27,.55); display: none; align-items: flex-end; justify-content: center; }
  .modal.on { display: flex; }
  .sheet { width: min(560px, 100%); background: #fff; border-radius: 18px 18px 0 0; padding: 18px 18px 26px; max-height: 88vh; overflow-y: auto; }
  .sheet h3 { font-size: 17px; margin-bottom: 12px; }
  .frow { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .frow label { flex: 1; min-width: 130px; font-size: 13px; color: var(--dim); }
  .frow input, .frow select, .frow textarea { width: 100%; margin-top: 4px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--edge); background: #fff; }
  .frow textarea { resize: vertical; min-height: 56px; }
  .sheet .btns { display: flex; gap: 8px; margin-top: 14px; }
  .sheet .btns .btn { flex: 1; padding: 12px; font-size: 15px; }
  .payopts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .payopts button { padding: 12px 6px; border-radius: 10px; border: 1.5px solid var(--edge); background: var(--card); font-size: 14px; font-weight: 600; }
  .payopts button.on { border-color: var(--green); background: var(--green-soft); color: var(--green); }

  #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(42,33,27,.92); color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 99; max-width: 88vw; }
  #toast.show { opacity: 1; }
  h2.sec { font-size: 15px; margin: 14px 0 8px; display: flex; align-items: center; gap: 8px; }
  h2.sec small { font-weight: 400; color: var(--dim); font-size: 12px; }
  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat.wide { grid-column: span 2; }
    nav.tabs button { font-size: 12.5px; padding: 8px 4px; }
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h1>湘村小灶 · 老板后台</h1>
    <p>输入老板令牌进入（仅老板手机使用）</p>
    <input id="tokenInput" type="password" placeholder="令牌" autocomplete="off">
    <button id="startBtn">进入后台</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="wrap" id="wrap" style="display:none">
  <header class="top">
    <h1>湘村小灶 <small style="font-size:12px;color:var(--dim)">老板后台</small> <span class="dot" id="wsDot"></span></h1>
    <nav class="tabs">
      <button data-page="live" class="on">实时</button>
      <button data-page="stats">统计</button>
      <button data-page="menu">菜单</button>
      <button data-page="member">会员</button>
    </nav>
  </header>

  <!-- ============ 实时页 ============ -->
  <section id="page-live">
    <div class="stats">
      <div class="stat"><div class="k">今日营收</div><div class="v" id="stRev">—</div></div>
      <div class="stat"><div class="k">今日订单</div><div class="v" id="stN">—</div></div>
      <div class="stat"><div class="k">客单价</div><div class="v" id="stAvg">—</div></div>
      <div class="stat warn"><div class="k">待接单</div><div class="v" id="stPend">—</div></div>
      <div class="stat gold"><div class="k">未收款</div><div class="v" id="stUnpaid">— <small>详情见日报</small></div></div>
    </div>
    <div class="chips" id="chips"></div>
    <div id="orderList"></div>
  </section>

  <!-- ============ 统计页 ============ -->
  <section id="page-stats" style="display:none">
    <div class="toolbar">
      <input type="date" id="repDate">
      <button class="btn" id="repBtn">查日报</button>
      <button class="btn ghost" id="expDaily">导出当日订单CSV</button>
    </div>
    <div id="dailyBox"></div>
    <div class="toolbar" style="margin-top:16px">
      <input type="month" id="repMonth">
      <button class="btn" id="monBtn">查月报</button>
      <button class="btn ghost" id="expMonthly">导出月度分析CSV</button>
    </div>
    <div id="monthlyBox"></div>
  </section>

  <!-- ============ 菜单页 ============ -->
  <section id="page-menu" style="display:none">
    <div class="toolbar">
      <button class="btn green" id="newDishBtn">＋ 新增菜品</button>
      <small style="color:var(--dim)">点击菜品卡片进行编辑</small>
    </div>
    <div id="dishList"></div>
  </section>

  <!-- ============ 会员页 ============ -->
  <section id="page-member" style="display:none">
    <div class="toolbar">
      <button class="btn green" id="newMemberBtn">＋ 建会员卡</button>
      <small style="color:var(--dim)">充值/调整仅限老板操作，用户不能自助充值</small>
    </div>
    <div id="memberList"></div>
  </section>
</div>

<!-- ============ 通用弹层：订单编辑 ============ -->
<div class="modal" id="editModal"><div class="sheet" id="editSheet"></div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'xcz_admin_token';
  var token = '';
  var orders = {};      // order_no -> order
  var dishes = [];
  var members = [];
  var chipStatus = '';
  var statCache = null;

  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 2600); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtRM(c) { return 'RM ' + (Number(c || 0) / 100).toFixed(2); }
  function klTime(iso) { try { return new Date(iso).toLocaleTimeString('zh-CN', { timeZone: 'Asia/Kuala_Lumpur', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function api(path, opts) {
    return fetch(path, Object.assign({ headers: { Authorization: 'Bearer ' + token } }, opts)).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  // ---------- 页面切换 ----------
  document.querySelectorAll('nav.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('nav.tabs button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      ['live', 'stats', 'menu', 'member'].forEach(function (p) {
        $('page-' + p).style.display = (b.getAttribute('data-page') === p) ? '' : 'none';
      });
      if (b.getAttribute('data-page') === 'menu') loadDishes();
      if (b.getAttribute('data-page') === 'member') loadMembers();
      if (b.getAttribute('data-page') === 'stats') { $('repDate').value = new Date().toISOString().slice(0, 10); loadReport(); }
    });
  });

  // ---------- 实时页 ----------
  var STATUS_LABEL = { pending: '待接单', confirmed: '制作中', served: '已上桌', cancelled: '已取消', rejected: '已拒绝', voided: '已作废' };
  var CHIPS = ['', 'pending', 'confirmed', 'served', 'rejected', 'cancelled', 'voided'];
  $('chips').innerHTML = CHIPS.map(function (c) {
    return '<button class="chip' + (c === 'pending' ? ' red' : '') + (!c ? ' on' : '') + '" data-chip="' + c + '">' + (c ? STATUS_LABEL[c] : '全部') + '</button>';
  }).join('');
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-chip]'); if (!b) return;
    chipStatus = b.getAttribute('data-chip');
    document.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === b); });
    renderOrders();
  });

  function applyOrder(o) {
    var isNew = !orders[o.order_no] && o.status === 'pending';
    orders[o.order_no] = Object.assign(orders[o.order_no] || {}, o);
    renderOrders();
    if (isNew) refreshStats();
  }
  function renderOrders() {
    var list = Object.keys(orders).map(function (k) { return orders[k]; }).sort(function (a, b) { return a.order_no < b.order_no ? 1 : -1; });
    if (chipStatus) list = list.filter(function (o) { return o.status === chipStatus; });
    $('orderList').innerHTML = list.length ? list.map(orderCard).join('') : '<div class="empty">当前筛选下没有订单</div>';
  }
  function orderCard(o) {
    var acts = '';
    if (o.status === 'pending') {
      acts += '<button class="main" data-a="confirm">接单</button><button class="warn" data-a="cancel">取消</button>';
    } else if (o.status === 'confirmed') {
      acts += '<button class="main" data-a="serve">整单上桌</button><button class="warn" data-a="void">作废</button>';
    } else if (o.status === 'rejected') {
      acts += '<button class="gold" data-a="edit">改单重派</button>';
    }
    if (o.status !== 'cancelled' && o.status !== 'voided' && o.status !== 'rejected') {
      acts += '<button data-a="edit">编辑</button>';
      acts += o.paid ? '<button data-a="unpay">撤销收款</button>' : '<button class="gold" data-a="pay">收款</button>';
    }
    if (o.status !== 'voided' && o.status !== 'cancelled') acts += '<button data-a="void">作废</button>';
    return '<div class="card">'
      + '<div class="ohead"><span class="tbl">' + esc(o.table_no) + '桌</span>'
      + '<span class="tag ' + o.status + '">' + STATUS_LABEL[o.status] + '</span>'
      + '<span class="ono">' + esc(o.order_no) + (o.source === 'manual' ? ' · 手动' : '') + '</span>'
      + '<span class="time">' + klTime(o.created_at) + '</span></div>'
      + '<div class="items">' + (o.items || []).map(function (it) {
          return '<div class="it' + (it.served ? ' done' : '') + '">' + esc(it.dish_name) + ' × ' + it.qty + '　<small style="color:var(--dim)">' + fmtRM(it.unit_price_cents) + '</small></div>';
        }).join('') + '</div>'
      + (o.note ? '<div class="note-line">📝 ' + esc(o.note) + '</div>' : '')
      + (o.reason ? '<div class="note-line" style="color:var(--red);background:var(--red-soft)">原因：' + esc(o.reason) + '</div>' : '')
      + '<div class="pay-line">' + (o.paid ? '<b class="paid">已收 ' + (o.payment_method === 'member' ? '会员卡' + esc(o.member_card_no || '') : { tng: 'TnG', cash: '现金', alipay: '支付宝', wechat: '微信', card: '银行卡' }[o.payment_method]) + '</b>' : '<b class="unpaid">未收款</b>') + (o.discount_cents ? ' · 优惠 ' + fmtRM(o.discount_cents) : '') + '</div>'
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px"><span class="oamount">' + fmtRM(o.total_cents) + '</span>'
      + '<div class="oact">' + acts + '</div></div></div>';
  }
  $('orderList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var no = b.closest('.card').querySelector('.ono').textContent.split(' ')[0];
    var a = b.getAttribute('data-a');
    if (a === 'edit') return openEdit(no);
    if (a === 'pay') return openPay(no);
    if (a === 'confirm') return act(no, 'confirm');
    if (a === 'serve') return act(no, 'serve');
    if (a === 'cancel') {
      var r = prompt('取消原因（必填）：'); if (!r || !r.trim()) return toast('取消必须填原因');
      return act(no, 'cancel', { reason: r.trim() });
    }
    if (a === 'void') {
      var r2 = prompt('作废原因（必填，账目留档不计营收）：'); if (!r2 || !r2.trim()) return toast('作废必须填原因');
      return fetch('/api/orders/' + no, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify({ reason: r2.trim() }) })
        .then(function (r) { return r.json(); }).then(function (o) { applyOrder(o); toast('已作废（可在"已作废"里查看）'); });
    }
    if (a === 'unpay') return act(no, 'pay', { method: '' });
  });
  function act(no, action, body) {
    api('/api/orders/' + no + '/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (o) { applyOrder(o); toast('操作成功'); })
      .catch(function (e) { toast('失败：' + e.message); });
  }

  // ---------- 收款弹层（含会员卡） ----------
  function openPay(no) {
    var o = orders[no];
    var sheet = $('editSheet');
    sheet.innerHTML = '<h3>收款 · ' + esc(o.table_no) + '桌 · ' + fmtRM(o.total_cents) + '</h3>'
      + '<div class="payopts" id="payOpts">'
      + ['tng|TnG', 'cash|现金', 'alipay|支付宝', 'wechat|微信', 'card|银行卡', 'member|会员卡'].map(function (x, i) {
          var kv = x.split('|');
          return '<button data-pm="' + kv[0] + '"' + (i === 0 ? ' class="on"' : '') + '>' + kv[1] + '</button>';
        }).join('') + '</div>'
      + '<div class="frow" id="memberRow" style="display:none"><label>会员卡号<input id="payCard" placeholder="输卡号"></label></div>'
      + '<div class="btns"><button class="btn ghost" id="pmCancel">取消</button><button class="btn green" id="pmOk">确认收款</button></div>';
    $('editModal').classList.add('on');
    var pm = 'tng';
    $('payOpts').addEventListener('click', function (e) {
      var b = e.target.closest('[data-pm]'); if (!b) return;
      pm = b.getAttribute('data-pm');
      document.querySelectorAll('#payOpts button').forEach(function (x) { x.classList.toggle('on', x === b); });
      $('memberRow').style.display = (pm === 'member') ? '' : 'none';
    });
    $('pmCancel').onclick = function () { $('editModal').classList.remove('on'); };
    $('pmOk').onclick = function () {
      act(no, 'pay', { method: pm, card_no: $('payCard') ? $('payCard').value.trim() : '' });
      $('editModal').classList.remove('on');
    };
  }

  // ---------- 订单编辑弹层（菜品/数量/价格/优惠/支付/桌号/备注） ----------
  function openEdit(no) {
    var o = orders[no];
    var sheet = $('editSheet');
    sheet.innerHTML = '<h3>编辑订单 ' + esc(o.order_no) + '</h3>'
      + '<div class="frow"><label>桌号<input id="edTable" value="' + esc(o.table_no) + '"></label></div>'
      + '<div id="edLines">' + (o.items || []).map(function (it, i) {

  // ---------- 拉取 & WS ----------
  function pull() { api('/api/orders?limit=200').then(function (l) { l.forEach(applyOrder); }).catch(function () {}); }
  function connectWs() {
    try {
      var proto = location.protocol === 'https:' ? 'wss' : 'ws';
      var ws = new WebSocket(proto + '://' + location.host + '/ws?token=' + encodeURIComponent(token));
      ws.onopen = function () { $('wsDot').classList.add('on'); };
      ws.onclose = function () { $('wsDot').classList.remove('on'); setTimeout(connectWs, 4000); };
      ws.onmessage = function (e) { try { var m = JSON.parse(e.data); if (m.type) applyOrder(m); } catch (_) {} };
    } catch (e) { setTimeout(connectWs, 8000); }
  }

  // ---------- 菜单管理 ----------
  function loadDishes() {
    api('/api/dishes/all').then(function (l) { dishes = l; renderDishes(); }).catch(function (e) { toast('菜单加载失败'); });
  }
  function renderDishes() {
    $('dishList').innerHTML = dishes.length ? dishes.map(function (d) {
      return '<div class="card" data-dish="' + d.id + '">'
        + '<div class="ohead"><span class="tbl" style="font-size:16px">' + esc(d.name) + '</span>'
        + '<span class="tag ' + (d.is_deleted ? 'cancelled' : d.is_active ? 'served' : 'pending') + '">' + (d.is_deleted ? '已删除' : d.is_active ? '在售' : '已下架') + '</span>'
        + '<span class="ono">' + esc(d.category) + '</span>'
        + '<span class="time">' + fmtRM(d.price_cents) + ' · 月售' + (d.monthly_sold_override !== null && d.monthly_sold_override !== undefined ? d.monthly_sold_override + '(调)' : d.monthly_sold) + '</span></div>'
        + (d.description ? '<div class="items" style="margin:4px 0;font-size:13px;color:var(--dim)">' + esc(d.description) + '</div>' : '')
        + (d.avoid_options && d.avoid_options.length ? '<div class="note-line">可定制：' + d.avoid_options.map(esc).join('、') + '</div>' : '')
        + '<div class="oact"><button class="main" data-da="edit">编辑</button>'
        + (d.is_deleted ? '' : '<button data-da="toggle">' + (d.is_active ? '下架' : '上架') + '</button>')
        + (d.is_deleted ? '' : '<button class="warn" data-da="del">删除</button>') + '</div></div>';
    }).join('') : '<div class="empty">还没有菜品，点上方新增</div>';
  }
  $('dishList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-da]'); if (!b) return;
    var id = b.closest('[data-dish]').getAttribute('data-dish');
    var da = b.getAttribute('data-da');
    if (da === 'edit') return openDishEdit(Number(id));
    if (da === 'toggle') return api('/api/dishes/' + id + '/toggle', { method: 'POST' }).then(loadDishes);
    if (da === 'del') {
      if (!confirm('删除菜品？有历史订单的会转为软删除（账目保留）')) return;
      api('/api/dishes/' + id, { method: 'DELETE' }).then(function (r) { toast(r.soft ? '已软删除（有历史订单，账目保留）' : '已删除'); loadDishes(); }).catch(function (e) { toast('失败：' + e.message); });
    }
  });
  function openDishEdit(id) {
    var d = dishes.filter(function (x) { return x.id === id; })[0] || { name: '', price_cents: 0, category: '招牌', description: '', avoid_options: [], animation_key: '', sort_order: 0, is_active: 1 };
    var isNew = !id;
    var sheet = $('editSheet');
    sheet.innerHTML = '<h3>' + (isNew ? '新增菜品' : '编辑 ' + esc(d.name)) + '</h3>'
      + '<div class="frow"><label>菜名<input id="deName" value="' + esc(d.name) + '" placeholder="如 农家一碗香"></label>'
      + '<label style="max-width:120px">价格 RM<input id="dePrice" type="number" step="0.01" min="0" value="' + (d.price_cents / 100).toFixed(2) + '"></label></div>'
      + '<div class="frow"><label>分类<input id="deCat" value="' + esc(d.category) + '" placeholder="招牌/热菜/主食/饮品…（招牌会进首页）"></label>'
      + '<label style="max-width:110px">排序<input id="deSort" type="number" value="' + (d.sort_order || 0) + '"></label></div>'
      + '<div class="frow"><label>简介<textarea id="deDesc" placeholder="食材与卖点，一句到位">' + esc(d.description) + '</textarea></label></div>'
      + '<div class="frow"><label>定制忌口（逗号分隔）<input id="deAvoid" value="' + esc((d.avoid_options || []).join('，').replace(/，/g, ', ')) + '" placeholder="免葱, 免香菜, 不放味精, 不放土豆"></label></div>'
      + '<div class="frow"><label style="max-width:170px">月售显示（留空=真实统计）<input id="deSold" type="number" min="0" value="' + (d.monthly_sold_override == null ? '' : d.monthly_sold_override) + '" placeholder="自动"></label>'
      + '<label style="max-width:150px">动画标记<input id="deAnim" value="' + esc(d.animation_key || '') + '" placeholder="ywk=一碗香动画"></label></div>'
      + '<div class="btns"><button class="btn ghost" id="deCancel">取消</button><button class="btn" id="deSave">' + (isNew ? '创建' : '保存') + '</button></div>';
    $('editModal').classList.add('on');
    $('deCancel').onclick = function () { $('editModal').classList.remove('on'); };
    $('deSave').onclick = function () {
      var body = {
        name: $('deName').value.trim(),
        price: $('dePrice').value,
        category: $('deCat').value.trim() || '招牌',
        description: $('deDesc').value.trim(),
        avoid_options: $('deAvoid').value.split(/[,，]/).map(function (x) { return x.trim(); }).filter(Boolean),
        monthly_sold_override: $('deSold').value === '' ? null : Number($('deSold').value),
        animation_key: $('deAnim').value.trim(),
        sort_order: Number($('deSort').value) || 0,
        is_active: true
      };
      if (!body.name) return toast('菜名必填');
      var pr = isNew
        ? api('/api/dishes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        : api('/api/dishes/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      pr.then(function () { $('editModal').classList.remove('on'); toast(isNew ? '已新增' : '已保存'); loadDishes(); })
        .catch(function (e) { toast('失败：' + e.message); });
    };
  }

        + '<span class="cardno">' + esc(m.card_no) + '</span>'

        + '<span class="bal">' + fmtRM(m.balance_cents) + '</span>'
        + '<div class="acts">'
        + '<button class="btn sm green" data-ma="topup" data-card="' + esc(m.card_no) + '">充值</button>'

        + '<button class="btn sm ghost" data-ma="logs" data-card="' + esc(m.card_no) + '">流水</button>'

  $('memberList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-ma]'); if (!b) return;
    var card = b.getAttribute('data-card');
    var ma = b.getAttribute('data-ma');
    if (ma === 'topup') {
      var amt = prompt('充值金额（RM，正数）：');
      if (amt === null) return;
      var c = Math.round(Number(amt) * 100);
      if (!Number.isFinite(c) || c <= 0) return toast('金额非法');
      api('/api/members/' + encodeURIComponent(card) + '/topup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount_cents: c }) })
        .then(function (r) { toast('已充值，余额 ' + r.balance_rm); loadMembers(); })
        .catch(function (e) { toast('失败：' + e.message); });
    }
    if (ma === 'adjust') {
      var a = prompt('调整金额（RM，可负数，如 -5 或 5）：');
      if (a === null) return;
      var ac = Math.round(Number(a) * 100);
      if (!Number.isFinite(ac) || ac === 0) return toast('金额非法');
      var why = prompt('调整原因（必填）：');
      if (!why || !why.trim()) return toast('必须填原因');
      api('/api/members/' + encodeURIComponent(card) + '/adjust', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount_cents: ac, reason: why.trim() }) })
        .then(function (r) { toast('已调整，余额 ' + r.balance_rm); loadMembers(); })
        .catch(function (e) { toast('失败：' + e.message); });
    }
    if (ma === 'logs') {
      api('/api/members/' + encodeURIComponent(card) + '/logs').then(function (logs) {
        var sheet = $('editSheet');
        sheet.innerHTML = '<h3>' + esc(card) + ' 流水（最近100条）</h3>'
          + '<table class="tb"><tr><th>时间</th><th>动作</th><th>金额</th><th>余额</th><th>单号/说明</th></tr>'
          + logs.map(function (l) {
              return '<tr><td>' + (l.at || '').slice(5, 16) + '</td><td>' + esc(l.action) + '</td>'
                + '<td style="color:' + (l.amount_cents < 0 ? 'var(--red)' : 'var(--green)') + '">' + fmtRM(Math.abs(l.amount_cents)) + (l.amount_cents < 0 ? ' 支' : ' 入') + '</td>'
                + '<td>' + fmtRM(l.balance_after) + '</td><td>' + esc(l.order_no || l.detail) + '</td></tr>';
            }).join('') + '</table>'
          + '<div class="btns"><button class="btn ghost" onclick="document.getElementById(\'editModal\').classList.remove(\'on\')">关闭</button></div>';
        $('editModal').classList.add('on');
      }).catch(function (e) { toast('失败：' + e.message); });
    }
    if (ma === 'toggle') {
      api('/api/members/' + encodeURIComponent(card) + '/toggle', { method: 'POST' }).then(function () { toast('已切换状态'); loadMembers(); });
    }
  });
  $('newMemberBtn').addEventListener('click', function () {
    var no = prompt('新卡号（字母数字，如 VIP003）：');

    var nm = prompt('会员称呼（可空）：') || '';

      .then(function () { toast('已建卡（余额0，记得充值）'); loadMembers(); })
      .catch(function (e) { toast('失败：' + e.message); });
  });

  // ---------- 手动加单入口（实时页顶部，动态注入） ----------
  var liveSec = $('page-live');
  var mnBar = document.createElement('div');
  mnBar.className = 'toolbar';
  mnBar.innerHTML = '<button class="btn green" id="manualBtn">＋ 手动加单</button><small style="color:var(--dim)">电话单 / 现场单直接进后厨</small>';
  liveSec.insertBefore(mnBar, liveSec.firstChild);
  $('manualBtn').addEventListener('click', function () { loadDishes(); setTimeout(function () { openManual(); }, 350); });

  // ---------- 登录 ----------
  function enter() {
    $('gate').classList.add('hide');
    $('wrap').style.display = '';
    pull();
    refreshStats();
    connectWs();
    setInterval(pull, 20000);
    setInterval(refreshStats, 60000);
    $('repDate').value = new Date().toISOString().slice(0, 10);
  }
  $('startBtn').addEventListener('click', function () {
    var t = $('tokenInput').value.trim();
    if (!t) { $('gateErr').textContent = '请输入令牌'; return; }
    localStorage.setItem(KEY, t);
    fetch('/api/reports/daily', { headers: { Authorization: 'Bearer ' + t } })
      .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
      .then(function () { token = t; enter(); })
      .catch(function () { localStorage.removeItem(KEY); $('gateErr').textContent = '令牌不对，请检查后重输'; });
  });
  $('tokenInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('startBtn').click(); });
  var saved = localStorage.getItem(KEY);
  if (saved) { $('tokenInput').value = saved; $('startBtn').textContent = '进入后台'; }
})();
</script>
</body>
</html>
