<script>window.MENU_DATA = {"brand":{"name":"湘村小灶","en":"XIANGCUN BISTRO","tagline":"湘菜 · 手打茶 · 吉隆坡","addr":"吉隆坡 · 市中心","hours":"11:00–23:00","hero_dish":"F01"},"categories":[{"id":"E","name":"招牌烧菜","en":"SIGNATURE BRAISES","zone":"hot"},{"id":"F","name":"全场头牌","en":"HOUSE LEGENDS","zone":"hot"},{"id":"D","name":"精品肉菜","en":"CHEF'S PICKS","zone":"hot"},{"id":"C","name":"家常小炒","en":"HOMEMADE WOK","zone":"hot"},{"id":"B","name":"下饭小炒","en":"WOK BASICS","zone":"hot"},{"id":"A","name":"开胃凉菜","en":"APPETIZERS","zone":"hot"},{"id":"S","name":"小甜水","en":"FRUIT TEA","zone":"cool"},{"id":"L","name":"手打柠檬茶","en":"LEMON TEA","zone":"cool"},{"id":"M","name":"轻乳茶","en":"MILK TEA","zone":"cool"}],"dishes":[{"id":"E01","name":"招牌跳跳蛙","price":48,"char":"跳","zone":"hot","list":"现杀牛蛙，猛火快爆，肉嫩如蒜瓣。","intro":"牛蛙活现斩块即炒——蛙腿肉受热蜷缩成蒜瓣状，猛火锁汁。青椒与紫苏垫底，辣意顺着骨缝往里钻。夹起来肉是弹的，放凉了也不柴。","origin":"吃蛙是湖南夜宵摊的半壁江山。株洲、湘潭的宵夜档，一口锅一把紫苏，跳跳蛙从子夜卖到天亮。吉隆坡的这锅换了南洋辣椒，火候还是湖南的。","ingredients":[{"n":"牛蛙","w":"现点现杀，肉才弹"},{"n":"紫苏","w":"湖南魂，去腥提香"},{"n":"青椒","w":"虎皮炕香，辣得有底蕴"},{"n":"蒜瓣","w":"整颗拍入，煨透回甘"}],"craft":["现杀斩块","猛火快爆","紫苏收锅"],"road":"湖南 · 株洲"},{"id":"E06","name":"油泼湘味牛肉","price":48,"char":"牛","zone":"hot","list":"鲜牛肉切薄片，辣子堆上滚油一激。","intro":"鲜牛肉逆纹切薄片，薄到透光。辣子与花椒堆顶，滚油一激，香气腾起。肉片边缘微卷，嫩里带韧，麻辣挂在表面，肉香锁在里面。","origin":"油泼是老长沙凉菜的做法，后来被湘菜馆借去做牛肉。牛肉不过油、不焯水，全凭油温定生死，多三秒就老。师傅那勺油，是这道菜的全部悬念。","ingredients":[{"n":"鲜牛肉","w":"逆纹切，多三秒就老"},{"n":"干辣椒","w":"马来西亚指天椒，香得凶"},{"n":"花椒","w":"汉寿椒，麻而不苦"},{"n":"葱白","w":"切丝垫底，激油后回甜"}],"craft":["逆纹切片","辣子堆顶","滚油激香"],"road":"湖南 · 长沙"},{"id":"E07","name":"干锅肥肠","price":48,"char":"肥","zone":"hot","list":"肥肠处理干净是底线，干锅越烧越入味。","intro":"肥肠翻洗到无一丝异味，先焯水去腥，再入干锅慢慢烧。锅底微火不熄，肠皮越烧越透，咬下去外层焦香、内里软糯。配一瓶汽水，这是夜宵的规矩。","origin":"干锅是湘西人先做起来的——吉首、怀化的山里人家，一口铁锅架在炭火上，菜端上去还在咕嘟。肥肠要翻面用面粉和醋搓洗三遍，这是底线。","ingredients":[{"n":"肥肠","w":"翻面面粉醋三洗，无异味"},{"n":"干锅底火","w":"微火不熄，越烧越透"},{"n":"干辣椒","w":"湘西椒，炒出香不炒出狠"},{"n":"洋葱","w":"垫底，吸尽肠香"}],"craft":["翻洗三遍","焯水去腥","干锅慢烧"],"road":"湖南 · 湘西"},{"id":"E09","name":"西红柿牛腩","price":48,"char":"柿","zone":"hot","list":"带筋牛腩配沙瓤番茄，砂锅慢炖两小时。","intro":"带筋牛腩与沙瓤番茄同入砂锅，小火两小时。番茄煮化了，酸味里带甜；牛腩酥而不散，筋膜透明。最后一勺汤浇饭，是这锅的收官。","origin":"砂锅炖牛腩是粤式茶楼的底子，传到湖南后改用鲜番茄替代番茄酱，酸味活、汤色清。本店番茄用金马仑高原的沙瓤种，皮厚肉起沙，炖进汤里不散形。","ingredients":[{"n":"带筋牛腩","w":"两小时慢炖，酥而不散"},{"n":"沙瓤番茄","w":"金马仑高原，酸甜足"},{"n":"冰糖","w":"一小块，把酸味抿圆"},{"n":"姜片","w":"压住肉腥，不抢味"}],"craft":["焯水净血","砂锅慢炖","番茄后下"],"road":"粤式底子 · 湘味改造"},{"id":"E10","name":"肥肠鱼","price":58,"char":"鱼","zone":"hot","list":"肥肠的厚、鱼肉的嫩，一锅麻辣收留。","intro":"肥肠先卤后烧，鱼肉片得薄而大。麻辣汤底翻滚，鱼片入锅十几秒起锅，嫩得弹舌；肥肠挂在汤里，越泡越透。一筷子鱼一筷子肠，谁也不抢谁。","origin":"肥肠鱼是近十几年才流行的新派湘菜，长沙夜宵街上混汤一锅出的做法。鱼选鲜活的，片完即下锅；肥肠要卤过再烧，两道工序少一道都立不住。","ingredients":[{"n":"鲜鱼","w":"现杀现片，十几秒起锅"},{"n":"卤肥肠","w":"先卤后烧，薄皮糯馅"},{"n":"干椒花椒","w":"双重麻辣的骨架"},{"n":"豆芽","w":"垫底生放，浇汤即熟"}],"craft":["肥肠先卤","麻辣汤滚","鱼片后下"],"road":"湖南 · 长沙"},{"id":"F01","name":"脆皮爆汁烤鱼","price":78,"char":"烤","zone":"hot","list":"整条现杀现烤，皮脆肉嫩。","intro":"整条现杀，先炭火烤定型，再入酱汁火上复烤。鱼皮烤到起泡发脆，鱼肉锁着汁，筷子破皮的脆响就是开吃的信号。锡纸盘里汤汁咕嘟着，越煮越入味。","origin":"烤鱼是万州人的发明，湘菜馆把它改出了锅气。本店做法两道火：一道炭火封皮，一道酱火攻肉，前后二十分钟，整鱼上桌不散形。吉隆坡的冬天不冷，但这锅照卖。","ingredients":[{"n":"鲜鱼","w":"整条现杀，一斤二上下"},{"n":"炭火","w":"头道封皮，脆而不焦"},{"n":"秘制酱","w":"豆豉打底，麻辣不糙"},{"n":"配菜","w":"藕片土豆芹菜，比鱼抢手"}],"craft":["整鱼现杀","炭火定型","酱汁复烤"],"road":"重庆万州底子 · 湘味改造"},{"id":"D04","name":"油豆腐红烧肉","price":38,"char":"油","zone":"hot","list":"五花肉煸出油，油豆腐吸饱汁。","intro":"五花肉煸到出油，边缘微卷；油豆腐下锅，孔洞吸饱酱汁，一口咬破，汤汁涌出来。肉的部分肥而不腻，豆腐的部分比肉还抢手。最后汤汁收浓，挂勺为度。","origin":"湖南乡下的年猪菜，杀猪那天必有这一锅。油豆腐要选浏阳的土灶浆点豆腐，孔密而紧，久煮不烂。五花肉必须带皮，肥肉煸出去一半油才够香。","ingredients":[{"n":"带皮五花肉","w":"煸出油，肥而不腻"},{"n":"油豆腐","w":"孔密紧实，一咬爆汁"},{"n":"冰糖","w":"炒糖色，红亮不发黑"},{"n":"八角","w":"一颗足矣"}],"craft":["煸肉出油","豆腐吸汁","收汁挂勺"],"road":"湖南 · 浏阳"},{"id":"D05","name":"干锅手撕鸡","price":38,"char":"手","zone":"hot","list":"盐焗鸡腿手撕成条，干锅慢慢烘出香。","intro":"盐焗鸡腿手撕成条——顺着纤维撕，鸡肉的嫩都在筋络里。干锅微火烘着，洋葱和西芹在锅底出甜，鸡条越烘越香。锅气往上冒的时候，是这道菜的状态。","origin":"手撕鸡源自客家盐焗鸡，湘菜馆把它挪进了干锅。撕鸡不用刀，刀口切断纤维口感就散了。这道菜适合酒精炉慢热，一锅吃到最后一根条还是热的。","ingredients":[{"n":"鸡腿","w":"盐焗入味再手撕"},{"n":"洋葱","w":"锅底烘出甜"},{"n":"西芹","w":"脆口解腻"},{"n":"干辣椒","w":"提香不抢戏"}],"craft":["盐焗鸡腿","顺纹手撕","干锅慢烘"],"road":"客家底子 · 湘味干锅"},{"id":"D08","name":"湘村酸菜鱼","price":38,"char":"酸","zone":"hot","list":"老坛酸菜配现杀鱼片，汤酸得干净。","intro":"老坛酸菜切细，先炒后煮，酸味是被炒醒的。鱼片上浆滑嫩，入汤即熟。汤色清亮，酸得干净不挂喉，喝一口胃就醒。在吉隆坡感冒的留学生，都惦记这一锅。","origin":"酸菜鱼是川渝的看家菜，湖南人把它改了脾气——酸菜要老坛三十天，酸里带甘；鱼汤不用红油，清亮见底。酸是开胃的酸，不是刺激的酸。","ingredients":[{"n":"鱼片","w":"现杀上浆，入汤即熟"},{"n":"老坛酸菜","w":"三十天坛龄，酸中带甘"},{"n":"泡椒","w":"酸味分层的关键"},{"n":"猪油","w":"汤醇的底"}],"craft":["炒醒酸菜","滚汤","鱼片汆烫"],"road":"川渝底子 · 湘味改良"},{"id":"D09","name":"凯里酸汤鱼","price":38,"char":"汤","zone":"hot","list":"苗家红酸汤，木姜子定调。","intro":"苗家红酸汤——番茄入坛自然发酵，酸得有层次。木姜子的香气是这锅的签名，鱼在汤里煮到入味，汤色橙红透亮。先喝汤再吃鱼，一碗之后是第二碗。","origin":"凯里是贵州黔东南苗侗聚居地，红酸汤是苗家的日常。番茄与淘米水入坛，发酵出自然的酸；木姜子是灵魂，没吃过的说像香茅，吃过的隔三年还记得。","ingredients":[{"n":"鱼","w":"酸汤煮鱼，味入三分"},{"n":"红酸汤","w":"番茄入坛自然发酵"},{"n":"木姜子","w":"苗家香料，无可替代"},{"n":"配菜","w":"木耳番茄，汤的陪衬"}],"craft":["坛发酵","汤滚味出","鱼入汤浸"],"road":"贵州 · 凯里"},{"id":"C03","name":"农家一碗香","price":25,"char":"一","zone":"hot","list":"鸡蛋炒碎、五花煸香、青椒虎皮，一碗里的三重火候。","intro":"一碗香讲究三样东西各自的火候：鸡蛋炒碎要嫩、五花肉煸香要卷边、青椒炕出虎皮。三样汇进一碗，蛋香裹肉香，青椒把两者串起来。盖在米饭上，就是一顿结结实实的饭。","origin":"一碗香是湖南农家忙季的饭——来不及做菜，地里有什么就往碗里放什么。后来被深圳湘菜馆带火，成了打工人下饭的代号。这一碗在吉隆坡，也是同样的位置。","ingredients":[{"n":"土鸡蛋","w":"炒碎才吸味"},{"n":"五花肉","w":"煸到卷边，油香四溢"},{"n":"螺丝椒","w":"虎皮纹，辣得脆生"},{"n":"酱油","w":"锅边一淋，香气封住"}],"craft":["炒蛋","煸肉","炕椒合炒"],"road":"湖南 · 益阳"},{"id":"C04","name":"香菜炒牛肚","price":25,"char":"香","zone":"hot","list":"现卤牛肚配整段香菜，脆嫩裹香。","intro":"现卤的牛肚切条，香菜整段下锅，二十秒出锅。牛肚脆嫩弹牙，香菜生脆，蒜香打头阵。这道菜吃的就是一个快字——多一秒，香菜的生青气就没了。","origin":"湘菜馆里香菜和内脏是老搭档，牛肚、牛肉、蛙都能配。香菜不切、整段下，切了汁水就跑。牛肚是本店每天现卤，隔夜的口感发绵，不用。","ingredients":[{"n":"牛肚","w":"每日现卤，脆嫩弹牙"},{"n":"整段香菜","w":"不切，保住生脆"},{"n":"蒜片","w":"拍蒜出香"},{"n":"干辣椒","w":"配色提香"}],"craft":["现卤","猛火快炒","香菜抢秒"],"road":"湖南 · 长沙"},{"id":"C05","name":"香菜炒牛肉","price":25,"char":"肉","zone":"hot","list":"鲜牛肉逆纹切，香菜梗一起爆。","intro":"鲜牛肉逆纹切片，裹一层薄油锁水。猛火下锅，香菜梗和牛肉一起爆，起锅前香菜叶才下。牛肉嫩、菜梗脆，辣味浮在表面，肉香沉在下面。","origin":"湘菜的牛肉讲究逆纹切——顺着纹切是柴，逆着纹切才嫩。香菜梗和肉同炒、叶子后放，是长沙馆子的老规矩，两秒之差，香气两个档次。","ingredients":[{"n":"鲜牛肉","w":"逆纹切，裹油锁嫩"},{"n":"香菜梗","w":"与肉同爆，脆而入味"},{"n":"指天椒","w":"鲜椒，辣得亮"},{"n":"锅边酱油","w":"起香收尾"}],"craft":["逆纹切片","猛火同爆","叶后下锅"],"road":"湖南 · 衡阳"},{"id":"C07","name":"酸菜鸡杂","price":25,"char":"鸡","zone":"hot","list":"鸡胗鸡心脆弹，酸菜解腻开胃。","intro":"鸡胗鸡心改花刀，猛火快炒，脆弹是口感的关键。酸菜整段下锅，酸味把内脏的厚味托起来。这一盘配白饭，一碗不够就两碗。","origin":"鸡杂从前是湖南屠户留给自己的下脚料，如今堂堂正正上了菜单。胗和心都要改花刀——不刀的鸡杂炒不出脆弹。酸菜整段下，脆对脆，口感不打架。","ingredients":[{"n":"鸡胗鸡心","w":"改花刀，脆弹加倍"},{"n":"酸菜","w":"老坛酸，开胃"},{"n":"姜蒜","w":"压味打底"},{"n":"指天椒","w":"鲜辣提色"}],"craft":["改花刀","猛火快炒","酸菜合炒"],"road":"湖南 · 长沙"},{"id":"C08","name":"肉末茄子煲","price":28,"char":"茄","zone":"hot","list":"茄子吸肉汁，砂锅收浓香。","intro":"茄子去皮切条，不油炸，砂锅慢慢煲软。肉末后下，油脂渗进茄条，汤汁收到浓稠。锅底结一层薄薄的锅巴，那是懂行的人用勺子刮着吃的部分。","origin":"湘菜馆的茄子煲，是鱼香茄子的少油版。不放油锅里炸，靠砂锅的余温把茄子煨出甜味。锅巴不是失误，是设计——砂锅上桌还在响，锅巴就是这么来的。","ingredients":[{"n":"茄子","w":"不油炸，煲出本味甜"},{"n":"肉末","w":"半肥瘦，油润茄条"},{"n":"砂锅","w":"余温慢煨，锅巴自结"},{"n":"蒜瓣","w":"整颗煨透回甘"}],"craft":["茄条煲软","肉末合煲","收汁结锅巴"],"road":"湖南 · 长沙"},{"id":"C09","name":"蒜香绝味凤爪","price":28,"char":"凤","zone":"hot","list":"猛火蒸透再爆蒜，爪劲十足。","intro":"凤爪先猛火蒸透，胶质炖出来，再下锅爆蒜。蒜香钻进每一道骨缝，皮是糯的、筋是弹的。吃凤爪的节奏：先嗦皮，再抻筋，最后嘬一口指节。","origin":"湖南夜宵摊的三大件——嗦虾、跳跳蛙、凤爪。凤爪要先蒸后炒，直接炒皮是硬的。蒜要手工剁成茸，机器打的出水，香气散一半。","ingredients":[{"n":"凤爪","w":"先蒸后炒，胶质全出"},{"n":"蒜茸","w":"手工剁，香气才足"},{"n":"指天椒","w":"鲜辣配色"},{"n":"葱油","w":"出锅前明油"}],"craft":["猛火蒸透","爆蒜","快炒出锅"],"road":"湖南 · 株洲"},{"id":"C10","name":"姜辣口味凤爪","price":28,"char":"爪","zone":"hot","list":"大量老姜配朝天椒，辣得有层次。","intro":"老姜整块拍碎，朝天椒剪段，凤爪在姜汤里煨足半小时。姜的辣在前，椒的辣在后，凤爪的胶质把两层辣裹住。下雨天来一盆，额头见汗才算到位。","origin":"姜辣是湘味里的湘西路数——山里湿气重，老姜驱寒是本能。老姜要用本地小种姜，纤维密、辣得正。凤爪煨半小时，辣味从皮渗到骨。","ingredients":[{"n":"老姜","w":"本地小种姜，纤维密"},{"n":"朝天椒","w":"辣得有先后"},{"n":"凤爪","w":"姜汤煨足半小时"},{"n":"冰糖","w":"一角，把辣抡圆"}],"craft":["老姜拍碎","汤煨入味","爪吸姜辣"],"road":"湖南 · 湘西"},{"id":"C11","name":"外婆菜炒肉末","price":25,"char":"菜","zone":"hot","list":"坛子菜配肉末，专治没胃口。","intro":"外婆菜是坛子咸菜——干萝卜、芥菜、酸豆角剁碎同腌，咸香里带酸。肉末下锅煸出油，外婆菜合炒，一勺油亮盖在饭上。坛子空了，这道菜就没了魂。","origin":"外婆菜是湖南人家米缸边的坛子菜，各家有各家的方子。儿女出门打工，行李里塞一罐，是娘的手艺。本店的外婆菜，配方来自老板娘的湖南丈母娘。","ingredients":[{"n":"外婆菜","w":"三样坛菜剁碎同腌"},{"n":"肉末","w":"半肥瘦，煸出油"},{"n":"干辣椒","w":"提香定调"},{"n":"酱油","w":"锅边少许"}],"craft":["剁坛菜","煸肉末","合炒收干"],"road":"湖南 · 岳阳"},{"id":"C13","name":"红油猪耳尖","price":28,"char":"猪","zone":"hot","list":"卤耳片红油拌，脆骨声先到。","intro":"猪耳先卤后片，斜刀薄切到透光。白肉在下、脆骨在上，红油拌匀，蒜水提味。咬下去先是脆骨的咔嚓声，然后是卤香和红油香一起上来。凉菜，热的节奏。","origin":"湘式红油拌菜，卤锅是十年的老卤，越用越香。猪耳片是个功夫活——斜刀走片，厚了嚼不动，薄了没口感。本店师傅片了十几年，刀不停。","ingredients":[{"n":"猪耳","w":"老卤浸足，脆骨完整"},{"n":"红油","w":"本店每日现炼"},{"n":"蒜水","w":"稀释红油不冲"},{"n":"香菜","w":"提色增香"}],"craft":["老卤浸煮","斜刀薄片","红油拌匀"],"road":"湖南 · 长沙"},{"id":"C14","name":"青椒爆炒猪耳尖","price":28,"char":"爆","zone":"hot","list":"卤耳片配螺丝椒，猛火抢出脆。","intro":"卤好的猪耳切薄片，螺丝椒先下锅炕出虎皮，耳片后下抢三秒。青椒的清香裹住耳片的卤香，脆上加脆。这道菜出锅九十秒，晚一秒口感就塌了。","origin":"湘菜的爆，就是三秒——猛火、热油、快翻。猪耳片先卤入味，再靠青椒的锅气把香气顶上去。本店这道菜从下锅到上桌，不超过两分钟。","ingredients":[{"n":"卤猪耳","w":"薄切，脆骨不碎"},{"n":"螺丝椒","w":"虎皮纹，香辣脆"},{"n":"蒜片","w":"猛火出香"},{"n":"锅边酒","w":"抢香去腻"}],"craft":["耳片备好","炕椒出虎皮","三秒合爆"],"road":"湖南 · 长沙"},{"id":"C15","name":"卤水猪耳尖","price":28,"char":"耳","zone":"hot","sold_out":true,"list":"潮式白卤，吃本味。","intro":"潮式白卤——八角、陈皮、南姜吊汤，卤水清亮。猪耳浸足一小时，片出来白净透光，蘸蒜蓉醋，酸把卤香托出来。不放红油不加椒，本味就是味道。","origin":"潮州白卤与湘式红卤是两个路数：白卤清、红卤厚。白卤锅小火养着，几年不熄。猪耳浸一小时是分寸——少一刻生，多一刻绵。","ingredients":[{"n":"猪耳","w":"白卤浸足一小时"},{"n":"白卤","w":"陈皮南姜，汤清见底"},{"n":"蒜蓉醋","w":"酸口托卤香"},{"n":"香菜","w":"点缀"}],"craft":["养卤","文火慢浸","现切装盘"],"road":"广东 · 潮州"},{"id":"B02","name":"爆炒土豆丝","price":13,"char":"土","zone":"hot","list":"细丝泡水去淀粉，猛火脆生。","intro":"土豆切细丝，火柴棍粗细，清水泡三遍洗去淀粉。猛火快炒九十秒，锅边淋醋，出锅脆生带酸香。土豆丝的标准是根根分明、盘底无汤——多炒十秒就是另一道菜。","origin":"土豆丝是每家小馆的试金石——切工、火候、调味，三样藏不住。本店的规矩：土豆丝泡水三遍、醋分两次放、出锅前撒葱花。十三块钱，考的是基本功。","ingredients":[{"n":"土豆","w":"手切细丝，泡水三遍"},{"n":"干辣椒","w":"几段，提香不喧宾"},{"n":"香醋","w":"锅边陈醋，生酸提脆"},{"n":"葱花","w":"出锅前撒"}],"craft":["切丝泡水","九十秒猛炒","锅边醋"],"road":"家常菜 · 南北通吃"},{"id":"B03","name":"肉末酸豆角","price":15,"char":"豆","zone":"hot","list":"酸豆角配肉末，一勺一饭。","intro":"酸豆角切细粒，肉末煸到出油，两者合炒一分钟即可。酸豆角的酸是坛子里长出来的，不是醋兑的——酸得温和，开胃不刺口。勺进饭里拌匀，一碗见底。","origin":"酸豆角是湖南坛子菜里最亲民的一样——豆角入坛，一周即成。配肉末是经典组合，长沙人管这个叫饭扫光。本店酸豆角自制，坛龄三年。","ingredients":[{"n":"酸豆角","w":"自制坛酸，切细粒"},{"n":"肉末","w":"煸出油花"},{"n":"干辣椒","w":"提香"},{"n":"蒜末","w":"猛火爆出"}],"craft":["切粒","煸肉","合炒一分钟"],"road":"湖南 · 常德"},{"id":"B04","name":"西红柿炒鸡蛋","price":15,"char":"蛋","zone":"hot","list":"蛋炒散、汁拌饭，家常菜的尽头。","intro":"鸡蛋炒到半凝就盛出，西红柿炒出沙再合回去。汤汁红亮，蛋块挂汁，加小半勺糖把酸味抿圆。这道菜没什么好说的——但做得好的，不多。","origin":"每个中国人学做的第一道菜。本店用金马仑高原的沙瓤番茄，皮厚起沙，炒得出汤。鸡蛋是本地土鸡蛋，炒三次：先炒蛋、后炒茄、再合炒，每一步都有分寸。","ingredients":[{"n":"番茄","w":"金马仑沙瓤，炒得出汤"},{"n":"土鸡蛋","w":"炒到半凝，嫩"},{"n":"糖","w":"半勺，圆酸味"},{"n":"葱花","w":"收尾"}],"craft":["先炒蛋","再炒茄出沙","合炒挂汁"],"road":"家常味 · 不问出处"},{"id":"B05","name":"干锅包菜","price":17,"char":"包","zone":"hot","list":"手撕大片配虾干，锅气脆甜。","intro":"包菜不用刀切，手撕成大片——手撕的边缘毛糙，挂味面积大。虾干爆香垫底，包菜猛火翻炒，锅气一足，菜叶的甜就出来了。素菜吃出荤香，就是这道菜的本事。","origin":"手撕包菜是湘菜馆的看家素菜。手撕和刀切口感确实两样：手撕边缘纤维撕裂，猛火下边缘微焦更香。虾干是本店加的南洋元素——马来西亚虾干，鲜味凶。","ingredients":[{"n":"包菜","w":"手撕大片，脆甜"},{"n":"虾干","w":"马来西亚虾干，鲜味足"},{"n":"蒜片","w":"猛火出香"},{"n":"黑醋","w":"锅边几滴"}],"craft":["手撕","虾干爆香","猛火快炒"],"road":"湖南 · 长沙"},{"id":"B07","name":"麻婆豆腐","price":15,"char":"麻","zone":"hot","list":"麻、辣、烫、嫩，八字箴言。","intro":"嫩豆腐切方块，在红汤里煨三分钟。郫县豆瓣炒出红油，牛肉末煸到酥香，花椒面最后撒。豆腐烫、嫩、挂汁，一勺进嘴，八字箴言挨个兑现。","origin":"成都万福桥陈麻婆的发明，最初是给码头脚夫做的菜。湘菜馆做麻婆豆腐，花椒减一分、豆瓣多一分。豆腐要嫩豆腐，煮三分钟是上限，再煮就散。","ingredients":[{"n":"嫩豆腐","w":"煨三分钟，烫嫩兼备"},{"n":"郫县豆瓣","w":"炒出红油"},{"n":"汉寿花椒","w":"麻香不苦"},{"n":"牛肉末","w":"煸到酥香"}],"craft":["豆瓣炒红","豆腐慢煨","花椒收口"],"road":"四川 · 成都"},{"id":"B08","name":"酸菜炒小笋","price":17,"char":"笋","zone":"hot","list":"嫩笋配坛酸，山里的时令。","intro":"小笋剥壳切片，脆嫩带一丝山野的清苦。酸菜切段同炒，酸味把清苦化开，脆对脆。猛火快炒一分钟出锅，多一分钟出水，就辜负了这口笋。","origin":"春笋是湖南山里的山珍，秋冬吃到的是冷冻鲜笋——从山里到吉隆坡，脆劲儿没丢。配酸菜是山里人的老搭配：笋管鲜，酸提味。","ingredients":[{"n":"小笋","w":"嫩笋切片，脆而清"},{"n":"酸菜","w":"老坛酸，化清苦"},{"n":"干辣椒","w":"提香"},{"n":"猪油","w":"山味的底"}],"craft":["笋切片","猪油爆香","快炒一分钟"],"road":"湖南 · 怀化"},{"id":"B11","name":"清炒时蔬","price":17,"char":"时","zone":"hot","sold_out":true,"list":"当日现采，猛火三分钟。","intro":"时蔬按日更换——菜心、空心菜、豌豆苗，看早市有什么。猛火三分钟，只放蒜片和盐，菜叶的甜自己会说话。一盘绿配一碗白饭，是整顿饭的呼吸口。","origin":"吉隆坡的菜批发市场离店四十分钟车程，老板每天早上六点自己提货。菜是当天采的、当天炒的、当天卖完的。菜单上写着时蔬，卖完就翻牌。","ingredients":[{"n":"当日时蔬","w":"早市现提，甜脆"},{"n":"蒜片","w":"唯一调料"},{"n":"猛火","w":"三分钟，多则出水"},{"n":"盐","w":"起锅前撒"}],"craft":["早市提货","整棵洗净","三分钟出锅"],"road":"吉隆坡 · 本地当日"},{"id":"B12","name":"油泼牛肚丝","price":17,"char":"丝","zone":"hot","list":"卤肚丝配辣子，滚油一激。","intro":"卤好的牛肚切细丝，堆上辣椒面和花椒粒。两百度的热油浇下去——刺啦一声，辣香腾起。肚丝弹牙，越嚼越香。这是凉菜，但要趁油热吃。","origin":"油泼的功夫在陕西，湘菜馆借来做了卤味。牛肚先卤后切，切丝要顺纹，逆纹断筋就没了弹。油温是命门：低了激不出香，高了辣椒发苦。","ingredients":[{"n":"牛肚","w":"先卤后切丝，弹牙"},{"n":"秦椒辣椒面","w":"香而不煞"},{"n":"花椒粒","w":"几粒提麻"},{"n":"热油","w":"两百度，一次浇够"}],"craft":["卤肚切丝","辣子堆顶","热油激香"],"road":"陕西功夫 · 湘味改造"},{"id":"B13","name":"外婆菜炒鸡蛋","price":18,"char":"婆","zone":"hot","list":"坛香碎蛋，一碗乡愁。","intro":"外婆菜剁细，土鸡蛋打散，猪油下锅炒到蛋碎金黄。外婆菜的咸香裹着蛋的软嫩，一勺进嘴，咸香松软。这道菜便宜，但湖南孩子点它的时候不看价格。","origin":"湖南小孩的外婆有两样拿手：坛子菜和炒鸡蛋。合在一起，就是假期里爸妈不在家时外婆的味道。本店外婆菜每日现剁，一下一下，都是手工。","ingredients":[{"n":"外婆菜","w":"手工现剁"},{"n":"土鸡蛋","w":"猪油炒，碎而嫩"},{"n":"猪油","w":"记忆里的香"},{"n":"葱花","w":"提香收尾"}],"craft":["剁菜","猪油炒蛋","合炒出锅"],"road":"湖南 · 岳阳"},{"id":"B14","name":"酸菜炒粉皮","price":18,"char":"炒","zone":"hot","list":"粉皮吸酸香，滑糯不烂。","intro":"粉皮切一指宽，酸菜炒香后下粉皮，加少许高汤煨半分钟。粉皮吸饱酸汤，滑糯弹牙，透明发亮。锅底的微焦是行家暗号——懂的人会叮嘱一句多炕一下。","origin":"粉皮是湖南乡下的手工货——米浆摊皮、蒸笼起皮、晾凉切宽条。炒着吃是湘潭、邵阳一带的做法。配酸菜，是米香和坛酸的两重奏。","ingredients":[{"n":"鲜粉皮","w":"米浆摊制，现切宽条"},{"n":"酸菜","w":"老坛酸"},{"n":"蒜叶","w":"炒出香味"},{"n":"老抽","w":"上色"}],"craft":["切粉皮","酸菜爆香","高汤煨炒"],"road":"湖南 · 湘潭"},{"id":"A01","name":"凉拌木耳","price":8,"char":"木","zone":"hot","list":"秋耳脆厚，酸辣开胃。","intro":"东北秋耳，泡发后肉厚脆弹。焯水三十秒即入冰水——一热一冷，脆度翻倍。蒜泥、辣椒油、陈醋调汁，拌好腌一下午，味道咬进耳朵里。","origin":"凉拌木耳是湖南家宴的开胃头盘。木耳要选东北秋耳——耳片厚实，口感才撑得住酸辣。本店辣椒油每日现炸，隔夜的香气就散了。","ingredients":[{"n":"秋木耳","w":"东北货，厚实脆弹"},{"n":"蒜泥","w":"手捣"},{"n":"辣椒油","w":"每日现炸"},{"n":"陈醋","w":"柔和酸香"}],"craft":["泡发洗净","焯冰交替","拌腌入味"],"road":"湖南 · 长沙"},{"id":"A02","name":"凉拌海带丝","price":8,"char":"带","zone":"hot","list":"海带丝蒜香油激，爽脆酸辣。","intro":"海带选用中层嫩段，焯水后过凉，手撕成丝。蒜泥打底，热油一激，芝麻香油收尾。一根海带丝能拉出半尺长——这是嫩海的证明。凉菜先行，这盘开路。","origin":"凉拌海带是夜宵摊的常备凉菜，湖南的街头做法重蒜重辣。海带要中层最嫩的部分，机器切的丝没有手工撕的弹。芝麻必须焙过，生的不香。","ingredients":[{"n":"海带","w":"中层嫩段，手撕成丝"},{"n":"蒜泥","w":"垫底"},{"n":"辣椒油","w":"红亮提色"},{"n":"焙芝麻","w":"香气收口"}],"craft":["焯水","手撕","拌油激香"],"road":"湖南 · 街头味"},{"id":"A03","name":"剁椒皮蛋","price":8,"char":"皮","zone":"hot","list":"剁椒盖顶，皮蛋溏心。","intro":"皮蛋选溏心的——蛋白弹滑，蛋黄流心，筷子一夹，芯往外淌。湖南剁椒盖顶，咸酸衬着蛋的碱香。一道凉菜，两重口感：弹的蛋白、糯的蛋黄。","origin":"剁椒拌皮蛋，是湘菜的冷盘开场。剁椒要用坛子发酵的，酸咸里带着活性；皮蛋要松花溏心的，蛋黄不凝才够格。剁椒盖上去，像给皮蛋盖了个章。","ingredients":[{"n":"松花皮蛋","w":"溏心，蛋黄欲滴"},{"n":"湖南剁椒","w":"坛子发酵，酸咸"},{"n":"香油","w":"提亮"},{"n":"葱花","w":"点缀"}],"craft":["剥壳切瓣","剁椒盖顶","淋油蒸一刻"],"road":"湖南 · 湘潭"},{"id":"A04","name":"凉拌腐竹","price":8,"char":"腐","zone":"hot","list":"腐竹筋道，花生增香。","intro":"腐竹要泡到完全回软——捏起来有筋骨，咬起来有弹性。花生米炸酥垫底，蒜辣汁浇上，香菜段拌匀。白的腐竹、红的花生衣、绿的香菜，一盘素菜的颜色就齐了。","origin":"腐竹是湖南衡阳一带的特产——豆子磨浆、扯皮晾晒，手工货有豆香。凉拌是夏天的吃法，配冰啤酒。花生必须炸过，生的不香。","ingredients":[{"n":"手工腐竹","w":"泡透有筋骨"},{"n":"花生米","w":"炸酥增香"},{"n":"蒜辣汁","w":"凉拌底味"},{"n":"香菜段","w":"脆口提色"}],"craft":["泡软","焯水","拌腌"],"road":"湖南 · 衡阳"},{"id":"A05","name":"凉拌黄瓜","price":8,"char":"黄","zone":"hot","list":"刀拍裂口，蒜香入缝。","intro":"黄瓜不切，刀背拍裂——裂缝里才挂得住蒜香。冰水拔过，脆度是脆上加脆。辣椒油、陈醋、糖三味调和，酸辣里带一丝甜。拍黄瓜的境界：蒜香入缝，汁水不流。","origin":"拍黄瓜的讲究在一拍——刀背下去，瓜身开裂而不断，表面积翻了三倍，蒜汁才进得去。本店用马来西亚小黄瓜，皮薄肉紧，比大黄瓜更脆。","ingredients":[{"n":"小黄瓜","w":"皮薄肉紧，冰水拔脆"},{"n":"蒜","w":"塞进裂缝"},{"n":"辣椒油","w":"本店自制"},{"n":"醋糖","w":"酸里回甜"}],"craft":["刀背拍裂","蒜香入缝","冰水拔脆"],"road":"家常味 · 南北通吃"},{"id":"A07","name":"油泼爆香黄金干","price":9.9,"char":"干","zone":"hot","list":"平江香干，乌黑油亮。","intro":"平江香干，乌黑的外表下是紧实的豆香。切条炸香，辣椒面和芝麻堆顶，热油一泼——香干的声音都听得见。嚼起来越嚼越香，豆香从喉咙往上返。","origin":"平江香干是湖南平江县的百年特产——豆腐压干、卤制、晾晒，颜色深黑但一点不咸。老平江人出门远行，包里必备一块。油泼是最简单也最见本色的做法。","ingredients":[{"n":"平江香干","w":"乌黑紧实，豆香足"},{"n":"辣椒面","w":"香而不煞"},{"n":"芝麻","w":"焙香"},{"n":"热油","w":"最后一泼"}],"craft":["香干切条","炸香","热油泼顶"],"road":"湖南 · 平江"},{"id":"S01","name":"西瓜海底椰霸王杯一升桶","price":12.9,"char":"海","zone":"cool","list":"一升的量，西瓜的鲜。","intro":"一升的桶，装的是当日现切的西瓜——连籽一起打，鲜甜里带沙感。海底椰沉在桶底，一勺捞起来，QQ弹弹。马来西亚的太阳下面，这一桶是硬通货。","origin":"一升杯是马来西亚茶室发明的街头规格——一杯管一下午。海底椰是南洋糖水的老搭档，口感弹韧。西瓜每日现打，不过夜。","ingredients":[{"n":"西瓜","w":"当日现打，不过夜"},{"n":"海底椰","w":"南洋糖水老搭档"},{"n":"刨冰","w":"细冰慢化"},{"n":"糖","w":"少许，瓜甜打底"}],"craft":["现切","现 :"少许"}],"craft":["窨香茶底","捶柠檬","加冰摇匀"],"road":"广西 · 横县"},{"id":"L06","name":"泰绿手打柠檬茶","price":9.9,"char":"绿","zone":"cool","list":"手标绿茶，翠绿透凉。","intro":"泰国手标绿茶，刷出来的茶汤翠绿——是叶绿素的颜色，不是色素。加柠檬后绿意更透，像把热带雨林装进了杯子。一杯下肚，曼谷街头的风就来了。","origin":"泰绿是清迈街头的老配方——手标绿茶粉用茶筅刷开，颜色青翠。曼谷的街边档口人手一桶。本店加了香水柠檬，绿得更干净，酸得也更直接。","ingredients":[{"n":"手标绿茶","w":"清迈货，青翠色"},{"n":"香水柠檬","w":"捶香提酸"},{"n":"冰","w":"满杯"},{"n":"糖水","w":"少许"}],"craft":["茶筅刷茶","捶柠檬","加冰摇匀"],"road":"泰国 · 清迈"},{"id":"M01","name":"单枞压香轻乳茶","price":9.9,"char":"乳","zone":"cool","list":"鸭屎香遇奶，香上加香。","intro":"鸭屎香单枞浓泡，鲜奶轻轻兑进去——茶香在前，奶香在后，一口两段。轻乳的轻，是奶的轻，不是茶味的轻。喝完杯壁挂着淡淡的茶色，这是浓泡的证明。","origin":"轻乳茶是这两年新茶饮的路数——不用植脂末，只用鲜奶。本店的配比：单枞浓泡三分之二，鲜奶三分之一，茶香立得住，奶感落得下。","ingredients":[{"n":"鸭屎香单枞","w":"浓泡，兰香立住"},{"n":"鲜奶","w":"不用植脂末"},{"n":"糖","w":"极少，茶甜自带"},{"n":"冰","w":"适量"}],"craft":["单枞浓泡","鲜奶轻兑","加冰"],"road":"广东 · 潮州"},{"id":"M02","name":"桃桃乌龙轻乳茶","price":9.9,"char":"乌","zone":"cool","list":"蜜桃果粒沉底，乌龙茶香托底。","intro":"黄桃果粒沉在杯底，一勺能捞起来吃。乌龙是焙香型的，茶感稳，压得住蜜桃的甜。先喝茶，果粒留在最后——像甜点藏在饮料里。","origin":"桃桃乌龙是新茶饮的经典配——果粒和茶底的分层感是卖点。本店黄桃用罐装糖渍的，甜度可控；乌龙选武夷焙香，焙火香给奶香当底座。","ingredients":[{"n":"乌龙茶","w":"武夷焙香，稳得住"},{"n":"黄桃粒","w":"罐装糖渍，甜度可控"},{"n":"鲜奶","w":"轻乳"},{"n":"糖","w":"少放"}],"craft":["冷泡乌龙","果粒沉底","兑奶"],"road":"福建武夷底子 · 新茶饮"},{"id":"M05","name":"锡兰红茶轻乳茶","price":11.9,"char":"兰","zone":"cool","list":"高地红茶，橙红透亮。","intro":"锡兰高地红茶，浓泡出来的茶汤是橙红色的——遇上鲜奶变成浅琥珀。茶味在前、奶味收尾，层次清楚。这一杯是本店茶底最贵的，喝得出来。","origin":"锡兰红茶是世界三大红茶之一——斯里兰卡高地茶场，海拔六百米以上。马来西亚人喝拉茶用的就是它，本店不拉、直接泡，茶味更直给。","ingredients":[{"n":"锡兰高地红茶","w":"橙红透亮，茶味直给"},{"n":"鲜奶","w":"轻乳"},{"n":"冰糖水","w":"柔和甜"},{"n":"冰","w":"少许"}],"craft":["浓泡红茶","兑奶","加冰"],"road":"斯里兰卡 · 高地"},{"id":"M06","name":"芽碧茉莉轻乳茶","price":9.9,"char":"碧","zone":"cool","list":"茉莉打底，青白可人。","intro":"茉莉花茶做底，鲜奶兑进去是青白色的——像清晨的窗纸。茉莉香先到，奶香跟上，喝完嘴里是干净的。这一杯适合配甜品，也适合什么都不配。","origin":"茉莉窨茶自带分寸——一芽一花，窨一夜筛一次，茶汤里留着花香、见不到花。轻乳茶的轻，恰好接住茉莉的雅。","ingredients":[{"n":"茉莉花茶","w":"窨制，花香入茶"},{"n":"鲜奶","w":"轻乳"},{"n":"糖","w":"少许"},{"n":"冰","w":"适量"}],"craft":["窨茶现泡","兑奶","加冰"],"road":"广西 · 横县"}]};</
